[workspace]
authors = ["Atreya Choudhury"]
channels = ["conda-forge"]
name = "sklearn"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/sklearn.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/sklearn.yml"

[dependencies]
python = ">=3.14.4,<3.15"
scikit-learn = ">=1.9.0,<2"
h5py = ">=3.16.0,<4"
numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
polars = ">=1,<2"

# env for quick dev tasks - avoid the regular deps
[feature.dev.dependencies]
python = ">=3.14.4,<3.15"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[feature.test.dependencies]
pytest = ">=8"

[feature.test.tasks]
test = "pytest"

[environments]
dev = { features = ["dev"], no-default-feature = true }
test = { features = ["test"] }
